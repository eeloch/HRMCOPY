# Release gates for Rotic HRM (added after the 2026-09-25 readiness review, which found no CI at all).
# A change should not be merged or deployed unless both jobs are green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Django tests, migrations, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: No model changes without a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Installed packages are consistent
        run: pip check
      - name: Test suite
        run: python manage.py test --parallel 2
      - name: Known vulnerabilities in dependencies (advisory)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    name: TypeScript, ESLint, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generate Next.js route types (a clean checkout has none, and layout.tsx uses them)
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint (zero errors and zero warnings)
        run: npx eslint . --max-warnings 0
      - name: Production build
        run: npm run build
      - name: Known vulnerabilities in dependencies (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
