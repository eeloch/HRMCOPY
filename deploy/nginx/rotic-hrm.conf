# nginx reverse proxy for Rotic HRM.
#
# Copy to /etc/nginx/sites-available/rotic-hrm.conf, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`. Run
# `certbot --nginx -d <your-domain>` once this is live to add HTTPS - it
# will edit this file to add the 443 server block and the redirect.
#
# Replace every <...> placeholder below before using this.

upstream rotic_hrm_backend {
    server 127.0.0.1:8000;
}

upstream rotic_hrm_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name <your-domain>;

    client_max_body_size 20M;

    # Django admin and API -> gunicorn.
    location /admin/ {
        proxy_pass http://rotic_hrm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://rotic_hrm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's collectstatic output (admin CSS/JS etc.) - safe to serve
    # directly, it holds no employee data.
    location /static/ {
        alias /opt/rotic_hrm/staticfiles/;
    }

    # --------------------------------------------------------------------
    # IMPORTANT: there is deliberately no `location /media/ { ... }` block
    # serving MEDIA_ROOT directly. Employee documents (national ID scans,
    # medical certificates, contracts) must only ever be reachable through
    # documents.views.EmployeeDocumentDownloadAPIView, which checks the
    # requester's permission before returning anything. A direct /media/
    # alias here would serve every uploaded file to anyone with the URL,
    # with no auth check at all - see the readiness audit.
    # --------------------------------------------------------------------

    # Internal hand-off target for X-Accel-Redirect. nginx serves the bytes
    # from here, but only ever reaches this block via an internal redirect
    # from the Django view above - it is not reachable directly from the
    # internet (`internal;` enforces that). Only needed if you've set
    # DOCUMENTS_USE_X_ACCEL_REDIRECT=True; otherwise Django streams the file
    # itself and this block is simply never hit.
    location /protected-media/ {
        internal;
        alias /opt/rotic_hrm/media/;
    }

    # Everything else -> the Next.js frontend.
    location / {
        proxy_pass http://rotic_hrm_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
